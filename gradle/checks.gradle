configurations { bbsFixture { transitive = false } }

dependencies {
    bbsFixture 'maven.modrinth:bbs-fs:tD7xHigj'
    testRuntimeOnly 'org.lwjgl:lwjgl:3.3.1:natives-linux'
    testRuntimeOnly 'org.lwjgl:lwjgl-glfw:3.3.1:natives-linux'
    testRuntimeOnly 'org.lwjgl:lwjgl-opengl:3.3.1:natives-linux'
}

def checks = [
    bbsSettingsTest: 'mcaxolotl.bbsspatialgui.BBSSettingsTests',
    pointerTest: 'mcaxolotl.bbsspatialgui.PointerTests',
    gpuTest: 'mcaxolotl.bbsspatialgui.GpuTests',
    upstreamRecorderTest: 'mcaxolotl.bbsspatialgui.UpstreamRecorderChecks',
    spatialCompatibilityTest: 'mcaxolotl.bbsspatialgui.SpatialCompatibilityChecks',
    localizationTest: 'mcaxolotl.bbsspatialgui.LocalizationTests'
]

checks.each { taskName, entrypoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entrypoint
        workingDir = layout.buildDirectory.dir("test-runtime/${taskName}").get().asFile
        doFirst { workingDir.mkdirs() }
        if (taskName in ['upstreamRecorderTest', 'spatialCompatibilityTest']) classpath += configurations.bbsFixture
        if (taskName == 'spatialCompatibilityTest') {
            systemProperty 'bsg.modJson',
                    layout.projectDirectory.file('src/main/resources/fabric.mod.json').asFile.absolutePath
            systemProperty 'bsg.mixinsJson',
                    layout.projectDirectory.file('src/main/resources/bbs_spatial_gui.mixins.json').asFile.absolutePath
        }
        if (taskName in ['gpuTest', 'upstreamRecorderTest']) {
            onlyIf {
                System.getenv('DISPLAY') || providers.gradleProperty('gpuTests')
                        .getOrElse('false').toBoolean()
            }
        }
    }
}

tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn checks.keySet().collect { tasks.named(it) } }
